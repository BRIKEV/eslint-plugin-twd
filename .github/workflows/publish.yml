name: Publish

on:
  release:
    types: [published]

# id-token: write is what makes this job publishable at all. npm Trusted
# Publishing authenticates it with a short-lived GitHub OIDC token instead of a
# long-lived NPM_TOKEN, and the same token signs provenance. Without this
# permission there is no credential to present, so the publish fails rather than
# quietly shipping an unsigned package.
#
# The trust is configured on npm against this repository AND this workflow
# filename, so renaming this file revokes it. Because `release` events run the
# default branch's copy of a workflow, a change here only takes effect once it
# is on main.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm

      # node:24 ships npm 11.13.0 and `npm stage publish` needs 11.15.0 or
      # newer. Do not remove this step.
      - name: Upgrade npm
        run: npm install -g npm@latest

      # The release tag (v0.1.0) must match package.json (0.1.0), so a release
      # can never publish a version other than the one it names.
      - name: Check the tag matches package.json
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="$(node -p "require('./package.json').version")"
          if [ "${tag#v}" != "$version" ]; then
            echo "FAIL: release tag $tag does not match package.json version $version"
            exit 1
          fi
          echo "OK: publishing $version"

      - name: Install dependencies
        run: npm ci

      - name: Type-check and test
        run: |
          npm run typecheck
          npm test

      - name: Build package
        run: npm run build

      - name: Verify the build
        run: |
          for f in dist/index.js dist/index.d.ts; do
            if [ ! -s "$f" ]; then
              echo "FAIL: $f is missing or empty"
              exit 1
            fi
            echo "OK: $f"
          done
          npm pack --dry-run

      # No NODE_AUTH_TOKEN, and no npm secret in this repository: the trusted
      # publisher on npm authenticates this job over OIDC.
      #
      # `stage publish` does NOT make the version live. It uploads the tarball
      # and defers proof-of-presence, so a green run here means "staged":
      # approve it in npm's UI or with `npm stage approve <stage-id>` to
      # actually publish (`npm stage list` finds it, `npm stage reject` discards
      # it). The credential CI holds can stage a release but not complete one.
      #
      # Prereleases go to the "beta" dist-tag so `npm install twd-lint` keeps
      # resolving to the latest stable version.
      - name: Stage the publish
        run: npm stage publish --access public --provenance ${{ github.event.release.prerelease && '--tag beta' || '' }}
