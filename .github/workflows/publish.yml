name: Publish

on:
  release:
    types: [published]

# id-token: write lets npm sign provenance (a public record that this package
# was built from this repo by this workflow). It also prepares the switch to
# npm Trusted Publishing, which authenticates over the same OIDC token and
# makes the NPM_TOKEN secret unnecessary.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm

      # The release tag (v0.1.0) must match package.json (0.1.0), so a release
      # can never publish a version other than the one it names.
      - name: Check the tag matches package.json
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="$(node -p "require('./package.json').version")"
          if [ "${tag#v}" != "$version" ]; then
            echo "FAIL: release tag $tag does not match package.json version $version"
            exit 1
          fi
          echo "OK: publishing $version"

      - name: Install dependencies
        run: npm ci

      - name: Type-check and test
        run: |
          npm run typecheck
          npm test

      - name: Build package
        run: npm run build

      - name: Verify the build
        run: |
          for f in dist/index.js dist/index.d.ts; do
            if [ ! -s "$f" ]; then
              echo "FAIL: $f is missing or empty"
              exit 1
            fi
            echo "OK: $f"
          done
          npm pack --dry-run

      # Token-based for now: NPM_TOKEN is a repository secret holding an npm
      # granular access token with publish rights. To move to Trusted Publishing
      # later, configure it on npmjs.com for this repo and this workflow file,
      # then delete the env block below and the secret.
      #
      # Prereleases go to the "beta" dist-tag so `npm install eslint-plugin-twd`
      # keeps resolving to the latest stable version.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            npm publish --access public --tag beta --provenance
          else
            npm publish --access public --provenance
          fi
