name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The example loads the built plugin from ../dist, the way a project
      # loads the published package. Its correct tests must lint clean.
      - name: Example app lints with the built plugin
        working-directory: example
        run: |
          npm ci
          npx tsc -b
          npx eslint src

      # The CLI as users run it, from the built package
      - name: twd-lint CLI on the example
        run: |
          node dist/cli.js example/src
          code=0
          node dist/cli.js example/lint-playground || code=$?
          if [ "$code" -ne 1 ]; then
            echo "FAIL: the lint playground should exit 1 (problems found), got $code"
            exit 1
          fi
