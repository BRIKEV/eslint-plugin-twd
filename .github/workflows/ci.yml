name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The example loads the built plugin from ../dist, the way a project
      # loads the published package. Its correct tests must lint clean.
      - name: Example app lints with the built plugin
        working-directory: example
        run: |
          npm ci
          npx tsc -b
          npx eslint src
